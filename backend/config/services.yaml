# Files in the packages/ subdirectory configure the dependencies; this one, the app's own services.
parameters:
    # Page images and clients' files: backend/var/uploads, outside the web root (public/). In-place deploys
    # (deploy/cpanel-update.sh) never touch var/, so they survive; back this folder up with the database.
    app.uploads_dir: '%kernel.project_dir%/var/uploads'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # Data, not services.
            - '../src/Api/Input/'
            - '../src/Api/Output/'
            # Needs NelmioApiDocBundle, which only dev and test install: registered below for those.
            - '../src/Api/OpenApi/'

# The #[ApiResponse] → OpenAPI describer: dev and test only, like NelmioApiDocBundle itself.
when@dev:
    services:
        App\Api\OpenApi\ApiResponseDescriber:
            tags: [{ name: nelmio_api_doc.route_describer, priority: -300 }]

when@test:
    services:
        # Wompi's API, faked: tests register the transactions and merchants it knows.
        App\Tests\Support\FakeWompi: ~
        App\Payment\WompiClient:
            arguments:
                $httpClient: '@App\Tests\Support\FakeWompi'
        App\Api\OpenApi\ApiResponseDescriber:
            tags: [{ name: nelmio_api_doc.route_describer, priority: -300 }]
