framework:
    messenger:
        # A message that failed every retry lands here instead of being lost: messenger:failed:show / :retry.
        failure_transport: failed

        transports:
            # A table in the app's own database (messenger_messages): a cPanel account has no Redis or RabbitMQ.
            # Drained by "messenger:consume async" — the worker service in docker compose, a cron line every minute on
            # the server (README, "Deploying to cPanel").
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    # A worker killed mid-message (by the host, a deploy) leaves the row claimed; Doctrine hands it out
                    # again after this many seconds instead of its default hour.
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    delay: 60000
                    multiplier: 5
            failed: 'doctrine://default?queue_name=failed&auto_setup=0'

        routing:
            # Emails are rendered in the request and sent from the queue (App\Mail\NotificationMailer).
            'Symfony\Component\Mailer\Messenger\SendEmailMessage': async

when@test:
    framework:
        messenger:
            transports:
                # Nothing runs by itself in the tests: they drain the queue explicitly, like a worker would (runWorker()).
                async: 'in-memory://'
                failed: 'in-memory://'
