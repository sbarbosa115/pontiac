# The API's own validation messages (ApiValidationException, buildViolation, constraint "message:" options), keyed by
# the English text they are written in. Symfony's standard messages come with the validator.
# A new message in PHP needs its line here (ValidatorsTranslationTest checks it), or a Spanish speaker reads English.
"Choose light, dark or system.": "Elige claro, oscuro o según el dispositivo."
"This address is already taken.": "Esa dirección ya la usa otro asesor."
"This address is reserved.": "Esa dirección está reservada."
"Use 3 to 60 lowercase letters, numbers and hyphens.": "Usa de 3 a 60 letras minúsculas, números y guiones."
"This value should be of type %type%.": "Este valor debe ser de tipo %type%."
"Choose among the features offered.": "Elige entre las funciones disponibles."
"Choose among the templates offered.": "Elige entre las plantillas disponibles."
"Choose one of the languages offered.": "Elige uno de los idiomas disponibles."
"Keep at least one reminder.": "Deja al menos un recordatorio."
"At most three reminders.": "Máximo tres recordatorios."
"This template is not available.": "Esa plantilla no está disponible."
"Another of your pages already uses this address.": "Otra de tus páginas ya usa esa dirección."
"Add the link the visitor will receive.": "Agrega el enlace que recibirá el visitante."
"The sections must be the ones of the page template.": "Las secciones deben ser las de la plantilla de la página."
"At most %max% items.": "Máximo %max% elementos."
"Fill in this field.": "Completa este campo."
"Use at most %max% characters.": "Usa máximo %max% caracteres."
"Enter a web address that starts with http:// or https://.": "Escribe una dirección web que empiece por http:// o https://."
"Choose an image from your library.": "Elige una imagen de tu biblioteca."
"Enter a real date.": "Escribe una fecha válida."
"At most %max% extra fields.": "Máximo %max% campos adicionales."
"Choose one of the field types offered.": "Elige uno de los tipos de campo disponibles."
"A list needs at least one option.": "Una lista necesita al menos una opción."
"At most %max% options.": "Máximo %max% opciones."
"Each option must be different.": "Cada opción debe ser distinta."
"Choose one of the colours offered.": "Elige uno de los colores disponibles."
"Choose one of your categories.": "Elige una de tus categorías."
"Choose an image to upload.": "Elige una imagen para subir."
"The image can be at most %max% MB.": "La imagen puede pesar máximo %max% MB."
"Upload a JPG, PNG or WebP image.": "Sube una imagen JPG, PNG o WebP."
"The image can be at most %max% pixels on each side.": "La imagen puede medir máximo %max% píxeles por lado."
"Choose the free plan people book here.": "Elige el plan gratuito que la gente reserva aquí."
"Write an amount with at most two decimals, e.g. \"250000.00\".": "Escribe un valor con máximo dos decimales, p. ej. \"250000.00\"."
"Choose a day and a time.": "Elige un día y una hora."
"Choose a day of the week.": "Elige un día de la semana."
"Write the time as HH:MM, e.g. 09:00.": "Escribe la hora como HH:MM, p. ej. 09:00."
"The end must be after the start.": "El final debe ser después del inicio."
"Two ranges of the same day overlap.": "Dos franjas del mismo día se cruzan."
"Choose the person.": "Elige a la persona."
"Choose a plan.": "Elige un plan."
"Choose the paid plans people pay for here.": "Elige los planes pagos que se pagan aquí."
"Paste the public key: it starts with \"pub_test_\" or \"pub_prod_\".": "Pega la llave pública: empieza por \"pub_test_\" o \"pub_prod_\"."
"Paste the private key: it starts with \"prv_test_\" or \"prv_prod_\".": "Pega la llave privada: empieza por \"prv_test_\" o \"prv_prod_\"."
"Paste the events secret: it starts with \"test_events_\" or \"prod_events_\".": "Pega el secreto de eventos: empieza por \"test_events_\" o \"prod_events_\"."
"Paste the integrity secret: it starts with \"test_integrity_\" or \"prod_integrity_\".": "Pega el secreto de integridad: empieza por \"test_integrity_\" o \"prod_integrity_\"."
"Use keys of one kind: all test keys or all production keys.": "Usa llaves de un solo tipo: todas de pruebas o todas de producción."
"Switching between test and production needs this key again.": "Al pasar entre pruebas y producción debes pegar esta llave de nuevo."
"Write the note.": "Escribe la nota."
"Choose who can read it.": "Elige quién puede leerla."
"Choose how it was paid.": "Elige cómo se pagó."
"Choose a file to upload.": "Elige un archivo para subir."
"The file can be at most %max% MB.": "El archivo puede pesar máximo %max% MB."
"Upload a PDF, an image (JPG, PNG, WebP), a spreadsheet (XLSX, CSV) or a Word document (DOCX).": "Sube un PDF, una imagen (JPG, PNG, WebP), una hoja de cálculo (XLSX, CSV) o un documento de Word (DOCX)."
"That is not your current password.": "Esa no es tu contraseña actual."
"Write your email.": "Escribe tu correo."
"Write a valid email, e.g. name@mail.com.": "Escribe un correo válido, por ejemplo nombre@correo.com."
"Write your current password.": "Escribe tu contraseña actual."
"Name the stage (at most 80 characters).": "Ponle nombre a la etapa (máximo 80 caracteres)."
"Choose whether the stage starts, continues or ends the flow.": "Elige si la etapa inicia, continúa o termina el flujo."
"Choose one of your email templates.": "Elige una de tus plantillas de correo."
"Alert after 1 to 365 days, or leave it empty.": "Avisa después de 1 a 365 días, o déjalo vacío."
"A flow has exactly one start stage.": "Un flujo tiene exactamente una etapa de inicio."
"Move the people in \"%stage%\" to another stage before removing it.": "Mueve a las personas de «%stage%» a otra etapa antes de quitarla."
"An arrow goes from one stage to another.": "Una flecha va de una etapa a otra."
"Choose what moves people along this arrow.": "Elige qué mueve a las personas por esta flecha."
"A stage has one arrow per event: the event would not know which to follow.": "Una etapa tiene una sola flecha por evento: el evento no sabría cuál seguir."
"Choose one of your active flows.": "Elige uno de tus flujos activos."
"Give the flow a name.": "Ponle nombre al flujo."
"Choose a stage.": "Elige una etapa."
"Give the template a name.": "Ponle nombre a la plantilla."
"Write the subject.": "Escribe el asunto."
"Write the email.": "Escribe el correo."
