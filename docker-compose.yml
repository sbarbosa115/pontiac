# Pontiac's local stack. Host ports come from variables so a second checkout (a feature worktree) can run its own
# stack next to this one: put HTTP_PORT, DB_PORT and MAILPIT_PORT in that checkout's root .env.
services:
  php:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./backend:/app
      - uploads:/var/uploads
    environment:
      UPLOADS_DIR: /var/uploads
      APP_URL: http://localhost:${HTTP_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy

  # Drains the Messenger queue (a table in the database), as the cron line does every minute on the cPanel server.
  # It restarts itself every hour, and after "messenger:stop-workers" — run that after changing PHP code.
  worker:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "-v"]
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - uploads:/var/uploads
    environment:
      UPLOADS_DIR: /var/uploads
      APP_URL: http://localhost:${HTTP_PORT:-8080}
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.4
    # utf8mb4 everywhere; utf8mb4_unicode_ci also exists on MariaDB, which cPanel servers often run.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Lets the app user create app_test for the test suite (MySQL has no "create any database" for a plain user).
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Builds the React UI (backend/assets → backend/public/build) and rebuilds on change.
  node:
    image: node:22-alpine
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run watch"

  # End-to-end tests (backend/e2e, Playwright). Not started with the stack:
  # `docker compose --profile e2e run --rm e2e`. The image tag must follow @playwright/test in package.json.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    ipc: host
    volumes:
      - ./backend:/app
    environment:
      HOME: /tmp
      E2E_BASE_URL: http://nginx
      MAILPIT_URL: http://mailpit:8025
    depends_on:
      - nginx
      - mailpit
    command: npx playwright test

  # Catches all outgoing email locally. Web inbox: http://localhost:${MAILPIT_PORT}
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db_data:
  uploads:
